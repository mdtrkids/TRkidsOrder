<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flash Express Tool (Exact Header Mode)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--bg:#f7fafc;--card:#fff;--muted:#6b7280;--border:#e5e7eb;--success:#10b981}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun",system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg);color:#111827}
header{padding:20px 16px; text-align:center}
h1{margin:0 0 6px;font-size:22px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.05);padding:20px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.hint{color:var(--muted);font-size:13px;display:block;margin-top:8px;text-align:center}
button{background:var(--primary);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:600;cursor:pointer;transition:0.2s}
button[secondary]{background:#f3f4f6;color:#111827;border:1px solid var(--border)}
button:disabled{opacity:.5;cursor:not-allowed}
.template-status{font-size:12px;padding:8px 12px;border-radius:8px;background:#fef3c7;color:#92400e;margin-bottom:10px;display:inline-block}
.template-status.loaded{background:#d1fae5;color:#065f46;border:1px solid #059669}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:14px;white-space:pre-line}
th{background:#f9fafb;position:sticky;top:0;z-index:1}
.hidden{display:none}
</style>
</head>
<body>

<header>
    <h1>Flash Express Export Tool</h1>
    <div id="templateIndicator" class="template-status">⚠️ ยังไม่ได้โหลด Template (หัวตารางอาจไม่ตรง)</div>
</header>

<div class="wrap">
    <section class="card">
        <div class="row">
            <!-- ปุ่มโหลด Template -->
            <input type="file" id="inputTemplate" class="hidden" accept=".xlsx,.xls,.csv">
            <button secondary onclick="document.getElementById('inputTemplate').click()">
                1. โหลดไฟล์ Template (เพื่อ Copy หัวตารางมาเป๊ะๆ)
            </button>
            <button id="btnExport" disabled>2. Export เป็น Excel (.xlsx)</button>
        </div>
        <span class="hint" id="status">รอรับข้อมูลจากระบบ TR Kids...</span>
    </section>

    <section class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="font-size:14px;font-weight:bold">พรีวิวข้อมูล (แก้ไขได้)</div>
            <div id="count" style="font-size:13px;color:var(--muted)">0 แถว</div>
        </div>
        <div style="overflow:auto;max-height:50vh;border:1px solid #eee">
            <table id="table">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ================= Config & State ================= */
let currentRows = [];
let inputFileName = "flash_export";
let CUSTOM_H = null; // จะเก็บหัวตาราง "เป๊ะๆ" จากไฟล์ที่ผู้ใช้โหลด

// หัวตารางพรีวิว (สำหรับแสดงผลในหน้าเว็บเท่านั้น)
const PREVIEW_HEADERS = ["Address (ต้นฉบับ)","ชื่อผู้รับ","ที่อยู่","รหัสไปรษณีย์","เบอร์โทร1","เบอร์โทร2","ยอด COD"];

/* ================= ฟังก์ชันโหลดหัวจาก Template (หัวใจสำคัญ) ================= */

document.getElementById('inputTemplate').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array', cellStyles: true});
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        // ดึงเฉพาะแถวแรก (หัวตาราง) มาเป็น Array
        const aoa = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
        if(aoa.length > 0) {
            CUSTOM_H = aoa[0]; // เก็บหัวตารางแถวที่ 1 ไว้ทั้งหมด (รวมตัวอักษรพิเศษทุกอย่าง)
            localStorage.setItem('flash_template_exact_h', JSON.stringify(CUSTOM_H));
            updateTemplateStatus();
            alert("บันทึกหัวตาราง 'เป๊ะๆ' จากไฟล์ของคุณเรียบร้อยแล้ว!");
        }
    };
    reader.readAsArrayBuffer(file);
});

function updateTemplateStatus() {
    const el = document.getElementById('templateIndicator');
    const stored = localStorage.getItem('flash_template_exact_h');
    if(stored) {
        CUSTOM_H = JSON.parse(stored);
        el.textContent = "✓ หัวตาราง: ใช้แบบเป๊ะๆ จาก Template ที่คุณโหลดไว้";
        el.classList.add('loaded');
    }
}

/* ================= Logic ประมวลผลที่อยู่ (เหมือนเดิม) ================= */

function th2ar(s){ if(!s) return ""; const th="๐๑๒๓๔๕๖๗๘๙"; return s.replace(/[๐-๙]/g,ch=>String(th.indexOf(ch))); }
function normalizeInline(s){ if(!s) return ""; return th2ar(s).replace(/\r\n?/g,"\n").replace(/[\u200B-\u200D\uFEFF]/g,"").replace(/[ \t\f\v]+/g," ").trim(); }
function findFirstPostcodeIndex(text){ const m = /\b\d{5}\b/.exec(th2ar(text)); return m ? m.index : -1; }
function collectPhones(text){ 
    const s = th2ar(text); const found = new Set(); 
    const re = /(?<!\d)(?:0(?:[\s\-()]*\d){9,10}|\+66(?:[\s\-()]*\d){8,9})(?!\d)/g; 
    let m; while ((m = re.exec(s))){ 
        let raw = m[0]; if (raw.startsWith("+66")) raw = "0" + raw.slice(3); 
        const dN = raw.replace(/\D/g,""); if (/^0\d{8,9}$/.test(dN)) { found.add(dN); if (found.size >= 2) break; } 
    } return Array.from(found); 
}
function extractNameAndAddressSmart(text){
    const s = normalizeInline(text);
    let lines = s.split("\n").map(t=>t.trim()).filter(Boolean);
    if (!lines.length) return { name:"", address:"", postcode:"" };
    let name = lines[0];
    let address = lines.slice(1).join(" ");
    const pIdx = findFirstPostcodeIndex(s);
    const postcode = pIdx !== -1 ? th2ar(s).substr(pIdx, 5) : "";
    return { name, address, postcode };
}

/* ================= แสดงตาราง & Export ================= */

function renderTable(){
    const thead = document.getElementById("thead");
    const tbody = document.getElementById("tbody");
    thead.innerHTML = "<tr>" + PREVIEW_HEADERS.map(h=>`<th>${h}</th>`).join("") + "</tr>";
    tbody.innerHTML = "";
    currentRows.forEach((row, idx) => {
        const tr = document.createElement("tr");
        PREVIEW_HEADERS.forEach(h => {
            const td = document.createElement("td");
            td.contentEditable = "true";
            td.textContent = row[h] || "";
            td.oninput = () => { currentRows[idx][h] = td.textContent; };
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    document.getElementById("count").textContent = `${currentRows.length} แถว`;
    document.getElementById("btnExport").disabled = currentRows.length === 0;
}

document.getElementById("btnExport").onclick = () => {
    if(!CUSTOM_H) {
        alert("กรุณาโหลดไฟล์ Template (ข้อ 1) ก่อน เพื่อให้หัวตารางตรงตามที่ Flash กำหนดเป๊ะๆ");
        return;
    }

    const aoa = [CUSTOM_H]; // แถวแรกใช้หัวที่ก๊อปมาเป๊ะๆ

    // ฟังก์ชันช่วยหา Index โดยการค้นหาข้อความบางส่วนจากหัวที่ก๊อปมา
    const getIdx = (keywords) => {
        return CUSTOM_H.findIndex(h => h && keywords.some(k => h.toString().includes(k)));
    };

    const idx = {
        orderNo: getIdx(["Customer_order_number"]),
        name:    getIdx(["Consignee_name"]),
        addr:    getIdx(["Address"]),
        post:    getIdx(["Postal_code"]),
        phone1:  getIdx(["Phone_number"]),
        phone2:  getIdx(["Phone_number2"]),
        cod:     getIdx(["COD"]),
        qty:     getIdx(["Number of parcels"]),
        weight:  getIdx(["Weight"]),
        itemType: getIdx(["Item_type"]),
        prodType: getIdx(["Product_type"]),
        payMethod: getIdx(["Payment method"]),
        remark:  getIdx(["Remark"])
    };

    currentRows.forEach(row => {
        const exportRow = new Array(CUSTOM_H.length).fill("");
        
        if(idx.orderNo !== -1) exportRow[idx.orderNo] = row["OrderNo"];
        if(idx.name !== -1)    exportRow[idx.name]    = row["ชื่อผู้รับ"];
        if(idx.addr !== -1)    exportRow[idx.addr]    = row["ที่อยู่"];
        if(idx.post !== -1)    exportRow[idx.post]    = row["รหัสไปรษณีย์"];
        if(idx.phone1 !== -1)  exportRow[idx.phone1]  = row["เบอร์โทร1"];
        if(idx.phone2 !== -1)  exportRow[idx.phone2]  = row["เบอร์โทร2"];
        if(idx.cod !== -1)     exportRow[idx.cod]     = row["ยอด COD"];
        
        // ค่า Default มาตรฐาน
        if(idx.qty !== -1)     exportRow[idx.qty]     = "1";
        if(idx.weight !== -1)  exportRow[idx.weight]  = "0.1";
        if(idx.itemType !== -1) exportRow[idx.itemType] = "อื่นๆ";
        if(idx.prodType !== -1) exportRow[idx.prodType] = "Standard";
        if(idx.payMethod !== -1) exportRow[idx.payMethod] = "payment by sender";
        if(idx.remark !== -1)  exportRow[idx.remark]  = row["OrderNo"];

        aoa.push(exportRow);
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    
    // ตั้งชื่อแท็บตามที่คุณต้องการ
    XLSX.utils.book_append_sheet(wb, ws, "Order Template");
    
    // บันทึกไฟล์
    XLSX.writeFile(wb, `${inputFileName}.xlsx`);
};

/* ================= Init ================= */
(function init(){
    updateTemplateStatus();
    
    const data = localStorage.getItem('waybillDataForFlash');
    if (data) {
        inputFileName = localStorage.getItem('workOrderNameForFlash') || "flash_export";
        Papa.parse(data, {
            header: true,
            complete: (res) => {
                currentRows = res.data.map(r => {
                    const addrRaw = r["Address"] || r["customer_address"] || "";
                    const {name, address, postcode} = extractNameAndAddressSmart(addrRaw);
                    const phones = collectPhones(addrRaw);
                    const isCod = (r["payment_method"]||"").toLowerCase().includes("cod");
                    const cod = isCod ? (r["total_amount"]||"0") : "0";
                    
                    return {
                        "OrderNo": r["Order.No"] || r["bill_no"] || "",
                        "Address (ต้นฉบับ)": addrRaw,
                        "ชื่อผู้รับ": name,
                        "ที่อยู่": address,
                        "รหัสไปรษณีย์": postcode,
                        "เบอร์โทร1": phones[0] || "",
                        "เบอร์โทร2": phones[1] || "",
                        "ยอด COD": cod
                    };
                });
                renderTable();
                document.getElementById("status").textContent = "ดึงข้อมูลจาก TR Kids เรียบร้อย";
            }
        });
        localStorage.removeItem('waybillDataForFlash');
    }
})();
</script>
</body>
</html>
