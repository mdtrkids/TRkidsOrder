<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flash Express Tool (Template Match Mode)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--bg:#f7fafc;--card:#fff;--muted:#6b7280;--border:#e5e7eb;--success:#10b981}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun",system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg);color:#111827}
header{padding:20px 16px; text-align:center}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.05);padding:20px;margin-bottom:16px}
.step-box{display:flex;flex-direction:column;gap:15px;align-items:center;padding:20px;border:2px dashed var(--border);border-radius:12px;transition:0.3s}
.step-box.active{border-color:var(--primary);background:#eff6ff}
.step-box.done{border-color:var(--success);background:#f0fdf4}
button{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-weight:600;cursor:pointer;font-size:16px}
button:disabled{opacity:.5;cursor:not-allowed}
.status-text{font-size:14px;margin-top:8px;color:var(--muted)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;white-space:pre-line}
th{background:#f9fafb;position:sticky;top:0}
.hidden{display:none}
</style>
</head>
<body>

<header class="wrap">
    <h1>Flash Express Export Tool</h1>
    <p style="color:var(--muted)">ระบบนำข้อมูลสวมทับ Template ของ Flash โดยตรง</p>
</header>

<div class="wrap">
    <!-- ขั้นตอนที่ 1: เลือก Template -->
    <section class="card" id="step1Box">
        <div class="step-box" id="templateUI">
            <strong id="templateTitle">ขั้นตอนที่ 1: เลือกไฟล์ Template จาก Desktop</strong>
            <input type="file" id="inputTemplate" class="hidden" accept=".csv,.xlsx">
            <button onclick="document.getElementById('inputTemplate').click()">เลือกไฟล์ fp_waybill_template_th</button>
            <div class="status-text" id="templateStatus">ยังไม่ได้เลือกไฟล์ Template</div>
        </div>
    </section>

    <!-- ขั้นตอนที่ 2: ตรวจสอบและ Export -->
    <section class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
            <strong>ขั้นตอนที่ 2: ตรวจสอบข้อมูลและ Export</strong>
            <button id="btnExport" disabled>Export เป็น Excel (.xlsx)</button>
        </div>
        <div style="overflow:auto;max-height:50vh;border:1px solid var(--border);border-radius:8px">
            <table id="previewTable">
                <thead>
                    <tr>
                        <th>Address (ต้นฉบับ)</th>
                        <th>ชื่อผู้รับ</th>
                        <th>ที่อยู่</th>
                        <th>รหัสไปรษณีย์</th>
                        <th>เบอร์โทร</th>
                        <th>COD</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="status-text" id="dataStatus" style="text-align:right">รอรับข้อมูลจากระบบ...</div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
let templateHeader = null; // จะเก็บหัวตารางที่ดูดมาจากไฟล์จริงของคุณ
let currentRows = [];
let inputFileName = "flash_order";

/* ================= 1. โหลดหัวตารางจากไฟล์ Template จริงของคุณ ================= */
document.getElementById('inputTemplate').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, {type: 'array', raw: true});
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        // ดึงเฉพาะแถวแรกมาเป็นหัวตาราง
        const aoa = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
        if(aoa && aoa.length > 0) {
            templateHeader = aoa[0]; // เก็บหัวตารางดั้งเดิมไว้
            localStorage.setItem('flash_header_cache', JSON.stringify(templateHeader));
            updateUIState();
        }
    };
    reader.readAsArrayBuffer(file);
});

function updateUIState() {
    const box = document.getElementById('step1Box');
    const status = document.getElementById('templateStatus');
    const title = document.getElementById('templateTitle');
    if(templateHeader) {
        status.textContent = "✓ โหลดหัวตารางจากไฟล์จริงสำเร็จ! (พร้อมใช้งาน)";
        status.style.color = "var(--success)";
        title.textContent = "ใช้หัวตารางจาก Template ของคุณแล้ว";
        document.getElementById('templateUI').className = "step-box done";
        checkReady();
    }
}

function checkReady() {
    if(templateHeader && currentRows.length > 0) {
        document.getElementById('btnExport').disabled = false;
    }
}

/* ================= 2. จัดการข้อมูลจากระบบ TR Kids ================= */
function th2ar(s){ if(!s) return ""; const th="๐๑๒๓๔๕๖๗๘๙"; return s.replace(/[๐-๙]/g,ch=>String(th.indexOf(ch))); }
function collectPhones(text){
    const s = th2ar(text);
    const re = /(?<!\d)(?:0(?:[\s\-()]*\d){9,10}|\+66(?:[\s\-()]*\d){8,9})(?!\d)/g;
    let m = re.exec(s);
    if(m) {
        let raw = m[0]; if (raw.startsWith("+66")) raw = "0" + raw.slice(3);
        return raw.replace(/\D/g,"");
    }
    return "";
}

function processTRKidsData(csvData) {
    currentRows = csvData.map(r => {
        const addrRaw = r["Address"] || r["customer_address"] || "";
        const orderNo = r["Order.No"] || r["bill_no"] || "";
        const phones = collectPhones(addrRaw);
        const all5 = [...th2ar(addrRaw).matchAll(/\b(\d{5})\b/g)];
        const postcode = all5.length ? all5[all5.length-1][1] : "";
        
        // แยกบรรทัดแรกเป็นชื่อ ที่เหลือเป็นที่อยู่
        const lines = addrRaw.split("\n").map(l=>l.trim()).filter(Boolean);
        const name = lines[0] || "";
        const address = lines.slice(1).join(" ") || "";

        const isCod = (r["payment_method"]||"").toLowerCase().includes("cod");
        const cod = isCod ? (r["total_amount"]||"0") : "0";

        return { orderNo, addrRaw, name, address, postcode, phones, cod };
    });
    
    renderPreview();
    checkReady();
}

function renderPreview() {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    currentRows.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.addrRaw}</td><td>${row.name}</td><td>${row.address}</td><td>${row.postcode}</td><td>${row.phones}</td><td>${row.cod}</td>`;
        tbody.appendChild(tr);
    });
    document.getElementById("dataStatus").textContent = `ดึงข้อมูลสำเร็จ: ${currentRows.length} แถว`;
}

/* ================= 3. EXPORT (สวมทับ) ================= */
document.getElementById('btnExport').addEventListener('click', function() {
    if(!templateHeader) return alert("กรุณาเลือกไฟล์ Template ในขั้นตอนที่ 1 ก่อนครับ");

    // สร้างข้อมูลใหม่โดยเอา หัวตารางเดิม มาวางเป็นแถวแรก
    const aoa = [templateHeader];

    currentRows.forEach(row => {
        // สร้างแถวว่างที่มีความยาวเท่ากับหัวตาราง
        const newRow = new Array(templateHeader.length).fill("");
        
        // วางข้อมูลลงในตำแหน่งที่ Flash กำหนด (อิงตามไฟล์ Template)
        newRow[0] = row.orderNo;  // เลขออเดอร์
        newRow[1] = row.name;     // ชื่อ
        newRow[2] = row.address;  // ที่อยู่
        newRow[3] = row.postcode; // ปณ
        newRow[4] = row.phones;   // โทร 1
        newRow[6] = "1";          // จำนวนพัสดุ
        newRow[7] = row.cod;      // ยอดเรียกเก็บ
        newRow[13] = "อื่นๆ";      // ประเภทสินค้า
        newRow[14] = "0.1";       // น้ำหนัก
        newRow[15] = "1"; newRow[16] = "1"; newRow[17] = "1"; // ขนาด
        newRow[21] = "Standard";
        newRow[22] = "payment by sender"; // วิธีชำระเงิน
        newRow[23] = row.orderNo; // หมายเหตุ (ใส่เลขออเดอร์ไว้อีกรอบ)

        aoa.push(newRow);
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Export");
    
    // บันทึกไฟล์
    XLSX.writeFile(wb, `${inputFileName}.xlsx`);
});

/* ================= 4. INIT ================= */
(function init(){
    // ลองโหลดหัวจาก Cache ถ้าเคยเลือกไว้แล้ว
    const cached = localStorage.getItem('flash_header_cache');
    if(cached) {
        templateHeader = JSON.parse(cached);
        updateUIState();
    }

    const trKidsData = localStorage.getItem('waybillDataForFlash');
    if (trKidsData) {
        inputFileName = localStorage.getItem('workOrderNameForFlash') || "flash_export";
        Papa.parse(trKidsData, {
            header: true,
            skipEmptyLines: true,
            complete: (res) => processTRKidsData(res.data)
        });
        localStorage.removeItem('waybillDataForFlash');
    }
})();
</script>
</body>
</html>
