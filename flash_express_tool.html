<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flash Express Export Tool (Perfect Match)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--bg:#f7fafc;--card:#fff;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun",system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg);color:#111827}
header{padding:20px 16px; text-align:center}
h1{margin:0 0 6px;font-size:22px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.05);padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.hint{color:var(--muted);font-size:13px;text-align:center;display:block;margin-top:10px}
button{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px;white-space:pre-line}
th{background:#f9fafb;position:sticky;top:0;z-index:1;text-align:left}
td[contenteditable="true"]{background:#fffdf7}
tr.missing td{ background:#ffe2e2 !important; }
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
</style>
</head>
<body>
<header class="wrap">
    <h1>ตรวจสอบและ Export ใบปะหน้า Flash</h1>
</header>
<div class="wrap">
    <section class="card">
        <div class="row">
            <button id="btnExport" disabled>Export เป็น Excel (.xlsx)</button>
        </div>
        <span class="hint" id="status">กำลังรอข้อมูลจากระบบ...</span>
    </section>

    <section class="card" style="margin-top:16px">
        <div class="topbar">
            <div style="font-size:14px; font-weight:bold">พรีวิวข้อมูล (แก้ไขได้)</div>
            <div id="count" style="font-size:13px; color:var(--muted)">0 แถว</div>
        </div>
        <div style="overflow:auto;max-height:65vh">
            <table id="table">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ================= หัวตารางเป๊ะ 100% จาก CSV ต้นฉบับ ================= */
const H = [
    "客户订单号\nCustomer_order_number\n(เลขออเดอร์ของลูกค้า)",
    "收件人名称\n*Consignee_name\n(ชื่อผู้รับ)",
    "地址\n*Address\n(ทิ่อยู่)",
    "邮编\n*Postal_code\n(รหัสไปรษณีย์)",
    "手机号\n*Phone_number\n(เบอร์โทรศัพท์)",
    "手机号2\nPhone_number2\n(เบอร์โทรศัพท์)",
    "包裹数量\nNumber of parcels \n（จำนวนพัสดุ）",
    "COD\n(ยอดเรียกเก็บ)",
    "\n商品描述1（名称|尺寸/重量|颜色|数量）\nItem description1(Name|Size/Weight|color|quantity)\nรายละเอียดสินค้า 1 (ชื่อสินค้า | ขนาด/น้ำหนัก | สี | จำนวน)",
    "商品描述2（名称|尺寸/重量|颜色|数量）\nItem description2(Name|Size/Weight|color|quantity)\nรายละเอียดสินค้า 2 (ชื่อสินค้า | ขนาด/น้ำหนัก | สี | จำนวน)",
    "商品描述3（名称|尺寸/重量|颜色|数量）\nItem description3(Name|Size/Weight|color|quantity)\nรายละเอียดสินค้า 3 (ชื่อสินค้า | ขนาด/น้ำหนัก | สี | จำนวน)",
    "商品描述4（名称|尺寸/重量|颜色|数量）\nItem description4(Name|Size/Weight|color|quantity)\nรายละเอียดสินค้า 4 (ชื่อสินค้า | ขนาด/น้ำหนัก | สี | จำนวน)",
    "商品描述5（名称|尺寸/重量|颜色|数量）\nItem description5(Name|Size/Weight|color|quantity)\nรายละเอียดสินค้า 5 (ชื่อสินค้า | ขนาด/น้ำหนัก | สี | จำนวน)",
    "物品类型\nItem_type\n(ประเภทสินค้า)",
    "重量\n*Weight_kg\n(น้ำหนัก)",
    "长\nLength\n(ยาว)",
    "宽\nWidth\n(กว้าง)",
    "高\nHeight\n(สูง)",
    "申报价值\nDeclared_value\n(มูลค่าสินค้าที่ระบุโดยลูกค้า)",
    "Box_shield ",
    "文件归还服务\nDocument return service\n(บริการส่งคืนเอกสาร)",
    "寄件产品\n*Product_type         \n(ประเภทสินค้า）",
    "付款方式\n*Payment method\n（วิธีชำระเงิน）",
    "备注\nRemark\n(หมายเหตุ)",
    "配送偏好地点备注\nDelivery Preference_location note \nหมายเหตุความต้องการในการจัดส่ง ",
    "配送联系偏好备注\nDelivery Preference_contact note \nหมายเหตุการติดต่อในการจัดส่ง"
];

const PREVIEW_HEADERS = ["Address (ต้นฉบับ)", "*ชื่อผู้รับ", "*ที่อยู่", "*รหัสไปรษณีย์", "*เบอร์โทรศัพท์", "เบอร์โทรศัพท์ 2", "COD"];
const REQUIRED_PREVIEW_INDEX = [1, 2, 3, 4]; // คอลัมน์ที่ห้ามว่าง

let currentRows = [];
let inputFileName = "flash_export";

/* ================= HELPERS (Logic เดิมของคุณที่เสถียรแล้ว) ================= */
function th2ar(s){ if(!s) return ""; const th="๐๑๒๓๔๕๖๗๘๙"; return s.replace(/[๐-๙]/g,ch=>String(th.indexOf(ch))); }
function normalizeInline(s){ if(!s) return ""; return th2ar(s).replace(/\r\n?/g,"\n").replace(/[\u200B-\u200D\uFEFF]/g,"").replace(/[ \t\f\v]+/g," ").trim(); }
function collectPhones(text){
    const s = th2ar(text);
    const found = new Set();
    const re = /(?<!\d)(?:0(?:[\s\-()]*\d){9,10}|\+66(?:[\s\-()]*\d){8,9})(?!\d)/g;
    let m;
    while ((m = re.exec(s))){
        let raw = m[0]; if (raw.startsWith("+66")) raw = "0" + raw.slice(3);
        const dN = raw.replace(/\D/g,"");
        if (/^0\d{8,9}$/.test(dN)) found.add(dN);
        if (found.size >= 2) break;
    }
    return Array.from(found);
}
function extractNameAndAddressSmart(text){
    const s = normalizeInline(text);
    let lines = s.split("\n").map(t=>t.trim()).filter(Boolean);
    if (!lines.length) return { name:"", address:"", postcode:"" };
    let name = lines[0]; // สมมติบรรทัดแรกเป็นชื่อ
    let address = lines.slice(1).join(" ");
    const all5 = [...th2ar(s).matchAll(/\b(\d{5})\b/g)];
    const postcode = all5.length ? all5[all5.length-1][1] : "";
    return { name, address, postcode };
}

/* ================= UI RENDER ================= */
function renderHeader(){
    document.getElementById("thead").innerHTML = "<tr>" + PREVIEW_HEADERS.map(h=>`<th>${h}</th>`).join("") + "</tr>";
}

function renderBody(){
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    currentRows.forEach((row, idx) => {
        const tr = document.createElement("tr");
        if (REQUIRED_PREVIEW_INDEX.some(i => !row.preview[i])) tr.classList.add("missing");
        
        row.preview.forEach((val, colIdx) => {
            const td = document.createElement("td");
            td.contentEditable = "true";
            td.textContent = val || "";
            td.oninput = () => {
                row.preview[colIdx] = td.textContent.trim();
                // อัปเดตข้อมูลที่จะ export จริงๆ ด้วย
                if(colIdx === 1) row.exportData[1] = td.textContent.trim(); // ชื่อ
                if(colIdx === 2) row.exportData[2] = td.textContent.trim(); // ที่อยู่
                if(colIdx === 3) row.exportData[3] = td.textContent.trim(); // ปณ
                if(colIdx === 4) row.exportData[4] = td.textContent.trim(); // โทร 1
                if(colIdx === 5) row.exportData[5] = td.textContent.trim(); // โทร 2
                if(colIdx === 6) row.exportData[7] = td.textContent.trim(); // COD
                
                if (REQUIRED_PREVIEW_INDEX.some(i => !row.preview[i])) tr.classList.add("missing");
                else tr.classList.remove("missing");
            };
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    document.getElementById("count").textContent = `${currentRows.length} แถว`;
    document.getElementById("btnExport").disabled = currentRows.length === 0;
}

/* ================= PROCESSING ================= */
function processData(csvData) {
    currentRows = csvData.map(r => {
        const addrRaw = r["Address"] || r["customer_address"] || "";
        const orderNo = r["Order.No"] || r["bill_no"] || "";
        const {name, address, postcode} = extractNameAndAddressSmart(addrRaw);
        const phones = collectPhones(addrRaw);
        const isCod = (r["payment_method"]||"").toLowerCase().includes("cod");
        const cod = isCod ? (r["total_amount"]||"0") : "0";

        // สร้างแถวสำหรับ Export (อิงตามจำนวนหัวตาราง H)
        const exp = new Array(H.length).fill("");
        exp[0] = orderNo;
        exp[1] = name;
        exp[2] = address;
        exp[3] = postcode;
        exp[4] = phones[0] || "";
        exp[5] = phones[1] || "";
        exp[6] = "1"; // จำนวนพัสดุ
        exp[7] = cod;
        exp[13] = "อื่นๆ";
        exp[14] = "0.1";
        exp[15] = "1"; exp[16] = "1"; exp[17] = "1";
        exp[21] = "Standard";
        exp[22] = "payment by sender";
        exp[23] = orderNo;

        return {
            preview: [addrRaw, name, address, postcode, phones[0]||"", phones[1]||"", cod],
            exportData: exp
        };
    });
    renderBody();
}

/* ================= EXPORT ================= */
document.getElementById("btnExport").addEventListener("click", () => {
    const aoa = [H]; // ใส่หัวตารางที่ถูกต้องลงไปก่อน
    currentRows.forEach(row => aoa.push(row.exportData));

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    
    // ตั้งค่าการ Wrap Text และจัดกึ่งกลางให้เหมือนต้นฉบับ
    const range = XLSX.utils.decode_range(ws['!ref']);
    for(let C = range.s.c; C <= range.e.c; C++) {
        const address = XLSX.utils.encode_cell({r: 0, c: C});
        if(!ws[address]) continue;
        ws[address].s = { alignment: { wrapText: true, vertical: 'center' } };
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
    XLSX.writeFile(wb, `${inputFileName}.xlsx`);
});

/* ================= INIT ================= */
(function init(){
    renderHeader();
    try {
        const storedData = localStorage.getItem('waybillDataForFlash');
        if (storedData) {
            inputFileName = localStorage.getItem('workOrderNameForFlash') || "flash_export";
            document.getElementById("status").textContent = "กำลังประมวลผลข้อมูล...";
            Papa.parse(storedData, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    processData(results.data);
                    document.getElementById("status").textContent = "นำเข้าข้อมูลสำเร็จ";
                    localStorage.removeItem('waybillDataForFlash');
                }
            });
        }
    } catch (e) { console.error(e); }
})();
</script>
</body>
</html>
